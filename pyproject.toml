[project]
name = "mujoco-project"
version = "0.1.0"
description = "MuJoCo UR5e manipulation playground"
requires-python = ">=3.12"
dependencies = [
    "ikpy==4.2.1",
    "matplotlib>=3.11.2",
    "mujoco>=4.0.1",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "transforms3d>=0.4.2",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.4.0",
    "stable-baselines3>=2.9.2",
    "tensorboard>=2.21.0",
    "torch>=2.15.0",
]
